name: Deploy API to Azure

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore backend/FoodWasteRescue.slnx

    - name: Build
      run: dotnet build backend/FoodWasteRescue.slnx --configuration Release --no-restore

    - name: Publish API
      run: dotnet publish backend/src/FoodWasteRescue.API/FoodWasteRescue.API.csproj --configuration Release --output ./publish/api

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy API to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: food-waste-rescue-api
        package: ./publish/api

    - name: Configure App Settings
      uses: azure/CLI@v2
      with:
        azcliversion: latest
        inlineScript: |
          az webapp config appsettings set \
            --name food-waste-rescue-api \
            --resource-group food-waste-rescue-rg \
            --settings \
              ConnectionStrings__DefaultConnection="${{ secrets.AZURE_SQL_CONNECTION_STRING }}" \
              JwtSettings__Secret="${{ secrets.JWT_SECRET }}" \
              JwtSettings__Issuer="${{ secrets.JWT_ISSUER }}" \
              JwtSettings__Audience="${{ secrets.JWT_AUDIENCE }}" \
              JwtSettings__ExpiryDays="7" \
              ASPNETCORE_ENVIRONMENT="Production" \
              WEBSITE_ENABLE_APP_SERVICE_STORAGE="true"
