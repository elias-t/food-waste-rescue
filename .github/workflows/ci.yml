# Pre-merge check for the backend: build + tests on every PR.
# deploy-api.yml runs the same gate again on push to main, right before publishing,
# so a failing test can never reach Azure. This workflow is what tells you BEFORE
# you merge; without it the first signal would be a red deploy on main.
name: CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Restore dependencies
      run: dotnet restore backend/FoodWasteRescue.slnx

    - name: Build
      run: dotnet build backend/FoodWasteRescue.slnx --configuration Release --no-restore

    # The suite uses SQLite in-memory and a substituted Hangfire client,
    # so it needs no database, no secrets and no Azure access.
    - name: Test
      run: dotnet test backend/FoodWasteRescue.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./test-results

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ./test-results
        if-no-files-found: warn
