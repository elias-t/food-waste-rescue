name: Deploy Worker to Azure

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore backend/FoodWasteRescue.slnx

    - name: Build
      run: dotnet build backend/FoodWasteRescue.slnx --configuration Release --no-restore

    - name: Publish Worker
      run: dotnet publish backend/src/FoodWasteRescue.Worker/FoodWasteRescue.Worker.csproj --configuration Release --output ./publish/worker

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy Worker to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: food-waste-rescue-worker
        package: ./publish/worker

    - name: Configure App Settings
      uses: azure/CLI@v2
      with:
        azcliversion: latest
        inlineScript: |
          az webapp config appsettings set \
            --name food-waste-rescue-worker \
            --resource-group food-waste-rescue-rg \
            --settings \
              ConnectionStrings__DefaultConnection="${{ secrets.AZURE_SQL_CONNECTION_STRING }}" \
              ASPNETCORE_ENVIRONMENT="Production"
