# Claude on demand:
#  - comment "@claude <request>" on an issue or PR  -> it answers, or implements and pushes a branch
#  - add the label "claude" to an issue             -> it implements the issue with the /feature skill
#    and opens a branch you can turn into a PR. You review and merge.
# Setup: run /install-github-app inside Claude Code in this repo, or add the secret yourself:
#   CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, uses your Pro/Max plan)
#   or ANTHROPIC_API_KEY (pay-as-you-go API key) - then swap the input below.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, labeled]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only run for the repo owner, so strangers can't spend your tokens.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Toolchains, so the hooks in .claude/ can build and test in CI too.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend
      - run: dotnet restore
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: "claude"
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 60
            --append-system-prompt "You are running unattended in GitHub Actions. For implementation requests use the /feature skill without waiting for spec approval, and record your assumptions in the spec."
